name: Build · Push · Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/streaming-server

jobs:

  build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build
    environment: production

    steps:
      - uses: actions/checkout@v4

      # git에 있는 설정 파일을 EC2로 복사
      - name: 설정 파일 동기화
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ubuntu
          key:      ${{ secrets.EC2_SSH_KEY }}
          source:   "docker-compose.yml,nginx/nginx.conf"
          target:   "/home/ubuntu/streaming-server"

      # 컨테이너 재배포
      - name: EC2 배포
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ubuntu
          key:      ${{ secrets.EC2_SSH_KEY }}
          timeout:  180s
          script: |
            set -e
            cd ~/streaming-server

            # GHCR 로그인
            echo "${{ secrets.GITHUB_TOKEN }}" | \
              docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # 환경변수 (EC2 .env 파일에서 읽음)
            export GITHUB_REPOSITORY=${{ github.repository }}
            export IMAGE_TAG=latest

            # 최신 이미지 pull
            docker compose pull streaming

            # 스트리밍 컨테이너 재시작
            docker compose up -d --no-deps streaming

            # 헬스체크 대기 (컨테이너 이름: vod-streaming)
            echo "헬스체크 대기 중..."
            for i in $(seq 1 18); do
              sleep 5
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' vod-streaming 2>/dev/null || echo "none")
              echo "  $i/18: $STATUS"
              if [ "$STATUS" = "healthy" ]; then
                echo "✓ vod-streaming healthy"
                break
              fi
              if [ $i -eq 18 ]; then
                echo "✗ 헬스체크 타임아웃"
                docker logs vod-streaming --tail 20
                exit 1
              fi
            done

            # nginx 시작/재시작
            docker compose up -d nginx

            sleep 3
            curl -sf http://localhost/health && echo "✓ 배포 완료"

            # 이전 이미지 정리
            docker image prune -f
