name: Build · Push · Deploy

on:
  push:
    branches:
      - main        # main 푸시 → 자동 배포
      - develop     # develop 푸시 → 빌드만 (배포 안 함)
  pull_request:
    branches:
      - main        # PR → 빌드 + 테스트만

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/streaming-server

jobs:

  # ── 1. 빌드 + 이미지 푸시 ────────────────────────────────
  build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # GHCR 푸시 권한

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      short_sha: ${{ steps.sha.outputs.short }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Docker 메타데이터 (태그 · 라벨)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: GHCR 로그인
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: BuildKit 설정
        uses: docker/setup-buildx-action@v3

      - name: 이미지 빌드 & 푸시
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha        # GitHub Actions 캐시 활용
          cache-to:   type=gha,mode=max

  # ── 2. EC2 배포 (main 브랜치만) ──────────────────────────
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production    # GitHub Environments 보호 규칙 적용

    steps:
      - name: Checkout (docker-compose 파일 필요)
        uses: actions/checkout@v4

      - name: EC2 SSH 배포
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ubuntu
          key:      ${{ secrets.EC2_SSH_KEY }}
          timeout:  120s
          script: |
            set -e

            echo "=== [1/4] GHCR 로그인 ==="
            echo "${{ secrets.GITHUB_TOKEN }}" | \
              docker login ghcr.io -u ${{ github.actor }} --password-stdin

            echo "=== [2/4] 최신 이미지 Pull ==="
            docker pull ghcr.io/${{ github.repository }}/streaming-server:latest

            echo "=== [3/4] 무중단 재시작 ==="
            cd ~/streaming-server

            # 환경변수 주입
            export GITHUB_REPOSITORY=${{ github.repository }}
            export IMAGE_TAG=latest
            export INSTANCE_TYPE=${{ vars.INSTANCE_TYPE || 't3.small' }}

            # 스트리밍 컨테이너만 재시작 (nginx는 유지 → 다운타임 최소화)
            docker compose pull streaming
            docker compose up -d --no-deps streaming

            echo "=== [4/4] 헬스체크 ==="
            sleep 15
            curl -sf http://localhost/health && echo "배포 성공"

      - name: 배포 결과 슬랙 알림 (선택)
        if: always()
        run: |
          STATUS="${{ job.status }}"
          SHA="${{ needs.build.outputs.short_sha }}"
          echo "배포 $STATUS — SHA: $SHA"
          # 슬랙 웹훅이 있으면 아래 활성화
          # curl -X POST ${{ secrets.SLACK_WEBHOOK }} \
          #   -H 'Content-type: application/json' \
          #   -d "{\"text\":\"스트리밍 서버 배포 $STATUS (sha: $SHA)\"}"

  # ── 3. 롤백 수동 트리거 ──────────────────────────────────
  rollback:
    name: Rollback (Manual)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    environment: production

    steps:
      - name: 이전 이미지로 롤백
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ubuntu
          key:      ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/streaming-server
            # 이전 태그로 복구
            export IMAGE_TAG=${{ github.event.inputs.rollback_tag || 'previous' }}
            docker compose up -d --no-deps streaming
            echo "롤백 완료: $IMAGE_TAG"
