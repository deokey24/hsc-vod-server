worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    # HLS MIME 타입 추가
    types {
        application/vnd.apple.mpegurl  m3u8;
        video/mp2t                     ts;
    }

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time';

    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;

    # ── 업스트림: Node.js 스트리밍 서버 ───────────────────
    upstream streaming_backend {
        server streaming:8888;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # ── HLS 세그먼트 직접 서빙 (nginx가 직접 처리 = 빠름) ──
        location /hls/ {
            alias /var/www/hls/;

            # CORS 헤더
            add_header Access-Control-Allow-Origin  *;
            add_header Access-Control-Allow-Methods "GET, OPTIONS";
            add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept";

            # .m3u8 — 캐시 금지 (항상 최신)
            location ~* \.m3u8$ {
                add_header Cache-Control "no-cache, no-store, must-revalidate";
                add_header Pragma no-cache;
                add_header Expires 0;
                add_header Content-Type "application/vnd.apple.mpegurl";
                add_header Access-Control-Allow-Origin *;
            }

            # .ts 세그먼트 — 단기 캐시 (변경 안 됨)
            location ~* \.ts$ {
                add_header Cache-Control "public, max-age=30";
                add_header Access-Control-Allow-Origin *;
            }
        }

        # ── API · 대시보드 · WebSocket — Node.js로 프록시 ──
        location / {
            proxy_pass         http://streaming_backend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";   # WebSocket 지원
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;  # WS 장시간 연결 유지
            proxy_send_timeout 3600s;
        }

        # 헬스체크 엔드포인트
        location /health {
            proxy_pass http://streaming_backend/api/metrics;
            access_log off;
        }
    }
}
