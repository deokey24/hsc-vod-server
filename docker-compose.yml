services:

  # ── 스트리밍 서버 ───────────────────────────────────────
  streaming:
    image: ghcr.io/${GITHUB_REPOSITORY:-deokey24/hsc-vod-server}/streaming-server:${IMAGE_TAG:-latest}
    container_name: streaming-server
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - FFMPEG_PATH=/usr/bin/ffmpeg
      - INSTANCE_TYPE=${INSTANCE_TYPE:-t3.small}
      - PORT=8888
      - NMS_PORT=8080
    volumes:
      - hls_data:/app/hls       # HLS 세그먼트 (nginx와 공유)
      - log_data:/app/logs      # 로그 영구 보존
    ports:
      - "1935:1935"             # RTMP 입력 (OBS)
      - "9998:9998/udp"         # SRT 입력
    networks:
      - streaming_net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8888/api/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ── Nginx 리버스 프록시 ─────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: streaming-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - hls_data:/var/www/hls:ro   # 스트리밍 서버와 HLS 공유
    networks:
      - streaming_net
    depends_on:
      streaming:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

volumes:
  hls_data:
    driver: local
  log_data:
    driver: local

networks:
  streaming_net:
    driver: bridge
