services:

  streaming:
    image: ghcr.io/${GITHUB_REPOSITORY:-deokey24/hsc-vod-server}/streaming-server:${IMAGE_TAG:-latest}
    container_name: vod-streaming
    restart: always
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - FFMPEG_PATH=/usr/bin/ffmpeg
      - INSTANCE_TYPE=${INSTANCE_TYPE:-t3.small}
      - API_PORT=8888
    volumes:
      - vod_hls_data:/app/hls
      - vod_log_data:/app/logs
    ports:
      - "1935:1935"
      - "9998:9998/udp"
    networks:
      - vod-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8888/api/metrics || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  nginx:
    image: nginx:1.25-alpine
    container_name: vod-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - vod_hls_data:/var/www/hls:ro
    networks:
      - vod-network
    depends_on:
      streaming:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

volumes:
  vod_hls_data:
  vod_log_data:

networks:
  vod-network:
    driver: bridge
